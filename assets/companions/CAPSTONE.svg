<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Tux and Tex the penguins">
<title>Tux and Tex the penguins</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.p1,.p2{transform-box:view-box;animation:huddle 1.6s ease-in-out infinite alternate}.p1{transform-origin:38px 100px}.p2{transform-origin:82px 100px;animation-direction:alternate-reverse}@keyframes huddle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}.trophy{animation:bob 1.6s ease-in-out infinite}</style>
