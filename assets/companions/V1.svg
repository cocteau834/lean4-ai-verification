<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Honk the goose">
<title>Honk the goose</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.neck{transform-box:view-box;transform-origin:58px 82px;animation:honk 2.6s ease-in-out infinite}@keyframes honk{0%,55%,100%{transform:rotate(0)}65%,80%{transform:rotate(-8deg)}}.beak{transform-box:view-box;transform-origin:47px 43px;animation:open 2.6s ease-in-out infinite}@keyframes open{0%,62%,84%,100%{transform:rotate(0)}68%,78%{transform:rotate(16deg)}}</style>
<defs><clipPath id="badge"><circle cx="60" cy="60" r="57"/></clipPath></defs>
<circle cx="60" cy="60" r="57" fill="#d5f2ed"/>
<g clip-path="url(#badge)">
<ellipse cx="60" cy="103" rx="30" ry="5" fill="#2b2433" opacity=".12"/>

<g stroke="#8b5a3c" stroke-width="5" stroke-linecap="round"><path d="M14 66 V102 M30 66 V102 M14 78 H30 M14 92 H30"/></g>
<g stroke="#b5835a" stroke-width="3"><path d="M14 78 H30 M14 92 H30"/></g>
<ellipse cx="70" cy="84" rx="26" ry="16" fill="#fbfbf7" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M62 80 C70 74 84 76 92 84 C82 90 70 90 62 80 Z" fill="#e6e6df"/>
<path d="M56 98 v6 h-4 M74 98 v6 h-4" fill="none" stroke="#ff9f1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g class="neck">
<path d="M52 82 C44 70 46 50 54 40 L64 44 C58 54 58 68 64 78 Z" fill="#fbfbf7" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="58" cy="38" r="12" fill="#fbfbf7" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<g class="blink"><circle cx="54" cy="35" r="2.8" fill="#2b2433"/><circle cx="55" cy="34" r="1" fill="#fff"/></g>
<path d="M47 38 L34 40 L47 44 Z" fill="#ff9f1c" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2"/>
<g class="beak"><path d="M47 42 L36 45 L47 46 Z" fill="#e8890f" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2"/></g>
<ellipse cx="60" cy="43" rx="3.8" ry="2.4" fill="#ff8fa3" opacity=".55"/>
</g>
</g>
</svg>
