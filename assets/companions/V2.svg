<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Inky the octopus">
<title>Inky the octopus</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.t1,.t2,.t3,.t4{transform-box:view-box;animation:wiggle 1.6s ease-in-out infinite alternate}.t1{transform-origin:40px 70px}.t2{transform-origin:52px 74px;animation-delay:.2s}.t3{transform-origin:68px 74px;animation-delay:.4s}.t4{transform-origin:80px 70px;animation-delay:.6s}@keyframes wiggle{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}.card{animation:bob 1.6s ease-in-out infinite alternate}</style>
<defs><clipPath id="badge"><circle cx="60" cy="60" r="57"/></clipPath></defs>
<circle cx="60" cy="60" r="57" fill="#d5f2ed"/>
<g clip-path="url(#badge)">
<ellipse cx="60" cy="103" rx="30" ry="5" fill="#2b2433" opacity=".12"/>

<g class="t1"><path d="M40 70 C30 80 26 92 34 98" fill="none" stroke="#e8789f" stroke-width="8" stroke-linecap="round"/></g>
<g class="t2"><path d="M52 74 C48 86 50 96 56 100" fill="none" stroke="#e8789f" stroke-width="8" stroke-linecap="round"/></g>
<g class="t3"><path d="M68 74 C72 86 70 96 64 100" fill="none" stroke="#e8789f" stroke-width="8" stroke-linecap="round"/></g>
<g class="t4"><path d="M80 70 C92 74 98 64 96 56" fill="none" stroke="#e8789f" stroke-width="8" stroke-linecap="round"/></g>
<g class="bob">
<path d="M34 60 C30 36 44 22 60 22 C76 22 90 36 86 60 C84 74 36 74 34 60 Z" fill="#f28fb0" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="48" cy="34" r="3" fill="#ffc2d6"/><circle cx="72" cy="30" r="4" fill="#ffc2d6"/>
<g class="blink"><circle cx="51" cy="52" r="4.2" fill="#2b2433"/><circle cx="52.4" cy="50.5" r="1.39" fill="#fff"/></g><g class="blink"><circle cx="69" cy="52" r="4.2" fill="#2b2433"/><circle cx="70.4" cy="50.5" r="1.39" fill="#fff"/></g><path d="M56.5 60 q1.75 2.4499999999999997 3.5 0 q1.75 2.4499999999999997 3.5 0" fill="none" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2"/><ellipse cx="44" cy="59" rx="4.6" ry="2.8" fill="#ff8fa3" opacity=".6"/><ellipse cx="76" cy="59" rx="4.6" ry="2.8" fill="#ff8fa3" opacity=".6"/>
</g>
<g class="card"><rect x="86" y="34" width="22" height="26" rx="3" fill="#fff" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.4"/>
<path d="M91 47 l4 4 l8 -9" fill="none" stroke="#16804a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>

</g>
</svg>
