<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Chisel the beaver">
<title>Chisel the beaver</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.tail{transform-box:view-box;transform-origin:72px 92px;animation:tap .9s ease-in-out infinite alternate}@keyframes tap{from{transform:rotate(0)}to{transform:rotate(-14deg)}}</style>
<defs><clipPath id="badge"><circle cx="60" cy="60" r="57"/></clipPath></defs>
<circle cx="60" cy="60" r="57" fill="#e3e9fb"/>
<g clip-path="url(#badge)">
<ellipse cx="60" cy="103" rx="30" ry="5" fill="#2b2433" opacity=".12"/>

<g class="tail"><ellipse cx="86" cy="92" rx="16" ry="8" fill="#5b3b2a" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M76 89 L96 95 M78 95 L94 89" stroke="#7a5440" stroke-width="2"/></g>
<g class="bob">
<ellipse cx="58" cy="80" rx="22" ry="20" fill="#8b5a3c" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="58" cy="84" rx="13" ry="13" fill="#c79a74"/>
<circle cx="41" cy="36" r="6" fill="#8b5a3c" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="75" cy="36" r="6" fill="#8b5a3c" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="58" cy="50" r="20" fill="#8b5a3c" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="58" cy="58" rx="12" ry="8.5" fill="#c79a74"/>
<g class="blink"><circle cx="50" cy="47" r="4.2" fill="#2b2433"/><circle cx="51.4" cy="45.5" r="1.39" fill="#fff"/></g><g class="blink"><circle cx="66" cy="47" r="4.2" fill="#2b2433"/><circle cx="67.4" cy="45.5" r="1.39" fill="#fff"/></g><ellipse cx="58" cy="54" rx="4" ry="3" fill="#2b2433"/>
<rect x="54" y="60" width="8" height="7" rx="1.5" fill="#fff" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2"/><path d="M58 60 V67" stroke="#2b2433" stroke-width="1.6"/>
<ellipse cx="44" cy="56" rx="4.6" ry="2.8" fill="#ff8fa3" opacity=".6"/><ellipse cx="72" cy="56" rx="4.6" ry="2.8" fill="#ff8fa3" opacity=".6"/>
<g transform="rotate(-25 40 78)"><rect x="37" y="66" width="6" height="22" rx="2" fill="#9aa6b2" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2"/>
<path d="M33 62 a7 7 0 1 1 14 0 l-4 3 h-6 z" fill="#9aa6b2" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2"/></g>
<ellipse cx="42" cy="82" rx="5" ry="4" fill="#7a4d33" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2"/>
</g>
