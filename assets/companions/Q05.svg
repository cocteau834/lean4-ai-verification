<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Zeta the beagle">
<title>Zeta the beagle</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.earL,.earR{transform-box:fill-box;transform-origin:50% 10%;animation:flop 1.8s ease-in-out infinite alternate}.earR{animation-direction:alternate-reverse}@keyframes flop{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}.sniff{transform-box:fill-box;transform-origin:center;animation:sniff .5s ease-in-out infinite alternate}@keyframes sniff{to{transform:translateY(-1px) scale(1.12)}}.glass{animation:scan 3s ease-in-out infinite}@keyframes scan{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-6px)}}</style>
<defs><clipPath id="badge"><circle cx="60" cy="60" r="57"/></clipPath></defs>
<circle cx="60" cy="60" r="57" fill="#e3e9fb"/>
<g clip-path="url(#badge)">
<ellipse cx="60" cy="103" rx="30" ry="5" fill="#2b2433" opacity=".12"/>

<g class="bob">
<ellipse cx="60" cy="84" rx="20" ry="17" fill="#fffaf2" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M44 78 C46 72 54 72 56 80 C54 88 46 88 44 78 Z" fill="#c47a3e"/>
<circle cx="60" cy="52" r="22" fill="#fffaf2" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M40 44 C42 34 52 30 58 32 C58 42 50 50 42 52 Z" fill="#c47a3e"/>
<g class="earL"><path d="M40 38 C28 40 28 62 36 66 C42 64 44 52 42 40 Z" fill="#6b4226" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g>
<g class="earR"><path d="M80 38 C92 40 92 62 84 66 C78 64 76 52 78 40 Z" fill="#6b4226" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g>
<g class="blink"><circle cx="52" cy="50" r="4.2" fill="#2b2433"/><circle cx="53.4" cy="48.5" r="1.39" fill="#fff"/></g><g class="blink"><circle cx="68" cy="50" r="4.2" fill="#2b2433"/><circle cx="69.4" cy="48.5" r="1.39" fill="#fff"/></g><g class="sniff"><ellipse cx="60" cy="61" rx="5" ry="3.6" fill="#2b2433"/></g><path d="M57 65 q1.5 2.0999999999999996 3 0 q1.5 2.0999999999999996 3 0" fill="none" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2"/><ellipse cx="46" cy="60" rx="4.6" ry="2.8" fill="#ff8fa3" opacity=".6"/><ellipse cx="74" cy="60" rx="4.6" ry="2.8" fill="#ff8fa3" opacity=".6"/>
</g>
<g class="glass"><circle cx="86" cy="80" r="11" fill="#cdeefe" opacity=".85" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M78 88 L68 99" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="5"/>
<path d="M82 75 a6 6 0 0 1 6 -2" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>

</g>
</svg>
