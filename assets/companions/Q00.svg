<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Pip the duckling">
<title>Pip the duckling</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.waddle{transform-box:view-box;transform-origin:60px 100px;animation:waddle 1.1s ease-in-out infinite alternate}@keyframes waddle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}.flapL,.flapR{transform-box:fill-box;transform-origin:50% 10%;animation:flap .55s ease-in-out infinite alternate}.flapR{animation-direction:alternate-reverse}@keyframes flap{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}</style>
<defs><clipPath id="badge"><circle cx="60" cy="60" r="57"/></clipPath></defs>
<circle cx="60" cy="60" r="57" fill="#e3e9fb"/>
<g clip-path="url(#badge)">
<ellipse cx="60" cy="103" rx="30" ry="5" fill="#2b2433" opacity=".12"/>

<g class="waddle">
<ellipse cx="51" cy="99" rx="7" ry="3.5" fill="#ff9f1c" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2"/><ellipse cx="69" cy="99" rx="7" ry="3.5" fill="#ff9f1c" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2"/>
<ellipse cx="60" cy="80" rx="25" ry="19" fill="#ffd84d" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<g class="flapL"><ellipse cx="37" cy="80" rx="6" ry="11" fill="#ffc93c" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.4"/></g>
<g class="flapR"><ellipse cx="83" cy="80" rx="6" ry="11" fill="#ffc93c" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.4"/></g>
<circle cx="60" cy="50" r="19" fill="#ffd84d" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M58 32 C56 24 62 22 64 27 C66 22 72 26 66 33" fill="#ffd84d" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.4"/>
<g class="blink"><circle cx="53" cy="47" r="4.2" fill="#2b2433"/><circle cx="54.4" cy="45.5" r="1.39" fill="#fff"/></g><g class="blink"><circle cx="67" cy="47" r="4.2" fill="#2b2433"/><circle cx="68.4" cy="45.5" r="1.39" fill="#fff"/></g><ellipse cx="60" cy="57" rx="8.5" ry="4.2" fill="#ff9f1c" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.4"/><ellipse cx="47" cy="55" rx="4.6" ry="2.8" fill="#ff8fa3" opacity=".6"/><ellipse cx="73" cy="55" rx="4.6" ry="2.8" fill="#ff8fa3" opacity=".6"/>
</g>
</g>
</svg>
