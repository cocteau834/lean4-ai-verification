<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Bandit the raccoon">
<title>Bandit the raccoon</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sway{transform-box:view-box;transform-origin:60px 100px;animation:sway 2.2s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-5deg) translateX(-3px)}to{transform:rotate(5deg) translateX(3px)}}.tail{transform-box:view-box;transform-origin:72px 88px;animation:swish 1.1s ease-in-out infinite alternate}@keyframes swish{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}</style>
<defs><clipPath id="badge"><circle cx="60" cy="60" r="57"/></clipPath></defs>
<circle cx="60" cy="60" r="57" fill="#e3e9fb"/>
<g clip-path="url(#badge)">
<ellipse cx="60" cy="103" rx="30" ry="5" fill="#2b2433" opacity=".12"/>

<g class="sway">
<g class="tail"><path d="M74 92 C96 96 104 80 98 70 C92 76 86 82 72 84 Z" fill="#8e8e99" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M88 80 l6 -4 M82 86 l7 -3" stroke="#3d3a45" stroke-width="4" stroke-linecap="round"/></g>
<ellipse cx="58" cy="84" rx="20" ry="17" fill="#8e8e99" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="58" cy="88" rx="11" ry="10" fill="#d9d9e0"/>
<path d="M38 40 L40 24 L52 34 Z" fill="#8e8e99" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M78 40 L76 24 L64 34 Z" fill="#8e8e99" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="58" cy="50" rx="23" ry="19" fill="#8e8e99" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M58 34 C50 34 44 40 40 46 C44 56 52 56 58 52 C64 56 72 56 76 46 C72 40 66 34 58 34 Z" fill="#efeff4"/>
<path d="M36 50 C40 42 50 42 56 48 C54 56 44 58 36 50 Z M80 50 C76 42 66 42 60 48 C62 56 72 58 80 50 Z" fill="#3d3a45"/>
<g class="blink"><circle cx="48" cy="49" r="3.8" fill="#fff"/><circle cx="49.4" cy="47.5" r="1.25" fill="#2b2433"/></g><g class="blink"><circle cx="68" cy="49" r="3.8" fill="#fff"/><circle cx="69.4" cy="47.5" r="1.25" fill="#2b2433"/></g>
<ellipse cx="58" cy="60" rx="4" ry="3" fill="#2b2433"/><path d="M55 64 q1.5 2.0999999999999996 3 0 q1.5 2.0999999999999996 3 0" fill="none" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2"/>
</g>
</g>
</svg>
