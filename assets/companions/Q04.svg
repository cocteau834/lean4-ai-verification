<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Delphi the owl">
<title>Delphi the owl</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.tilt{transform-box:view-box;transform-origin:60px 62px;animation:tilt 3.4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}60%{transform:rotate(7deg)}}</style>
<defs><clipPath id="badge"><circle cx="60" cy="60" r="57"/></clipPath></defs>
<circle cx="60" cy="60" r="57" fill="#e3e9fb"/>
<g clip-path="url(#badge)">
<ellipse cx="60" cy="103" rx="30" ry="5" fill="#2b2433" opacity=".12"/>

<ellipse cx="60" cy="80" rx="27" ry="23" fill="#8d6e63" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="60" cy="86" rx="16" ry="15" fill="#e7d6bd"/>
<path d="M52 82 q3 3 6 0 M62 82 q3 3 6 0 M56 90 q3 3 6 0" fill="none" stroke="#b99a7a" stroke-width="2"/>
<path d="M33 80 C30 92 38 100 44 98" fill="#7a5d53" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M87 80 C90 92 82 100 76 98" fill="#7a5d53" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<g class="tilt">
<path d="M34 34 L40 18 L50 30 Z" fill="#8d6e63" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M86 34 L80 18 L70 30 Z" fill="#8d6e63" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="60" cy="44" rx="28" ry="22" fill="#8d6e63" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="48" cy="44" r="11" fill="#fff4d6" stroke="#f2c14e" stroke-width="3"/><circle cx="72" cy="44" r="11" fill="#fff4d6" stroke="#f2c14e" stroke-width="3"/>
<g class="blink"><circle cx="48" cy="44" r="5.5" fill="#2b2433"/><circle cx="49.4" cy="42.5" r="1.82" fill="#fff"/></g><g class="blink"><circle cx="72" cy="44" r="5.5" fill="#2b2433"/><circle cx="73.4" cy="42.5" r="1.82" fill="#fff"/></g><path d="M56 54 L64 54 L60 61 Z" fill="#f2a541" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2"/>
</g>
<path d="M50 102 v4 M55 102 v4 M65 102 v4 M70 102 v4" stroke="#f2a541" stroke-width="3" stroke-linecap="round"/>

</g>
</svg>
