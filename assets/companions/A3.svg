<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Lemma the crow">
<title>Lemma the crow</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.peck{transform-box:view-box;transform-origin:60px 66px;animation:peck 2.2s ease-in-out infinite}@keyframes peck{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}80%{transform:rotate(0)}88%{transform:rotate(-8deg)}}</style>
<defs><clipPath id="badge"><circle cx="60" cy="60" r="57"/></clipPath></defs>
<circle cx="60" cy="60" r="57" fill="#ebe2fb"/>
<g clip-path="url(#badge)">
<ellipse cx="60" cy="103" rx="30" ry="5" fill="#2b2433" opacity=".12"/>

<path d="M74 84 L98 96 L92 84 L100 80 Z" fill="#2f3a4f" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="62" cy="78" rx="22" ry="19" fill="#3c4a63" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M50 74 C58 70 70 72 80 80 C70 86 58 86 50 74 Z" fill="#2f3a4f"/>
<path d="M54 96 v8 M66 96 v8" stroke="#f2c14e" stroke-width="3" stroke-linecap="round"/>
<g class="peck">
<circle cx="52" cy="50" r="18" fill="#3c4a63" stroke="#2b2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="46" cy="48" r="4.6" fill="#fff"/><g class="blink"><circle cx="46" cy="48" r="3" fill="#2b2433"/><circle cx="47" cy="46.8" r="1" fill="#fff"/></g>
<path d="M34 52 L18 56 L34 60 Z" fill="#f2c14e" stroke="#2b2433" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.4"/>
<g transform="translate(-2 2)"><circle cx="14" cy="60" r="4" fill="none" stroke="#f2c14e" stroke-width="3"/><path d="M18 60 h10 M24 60 v4" stroke="#f2c14e" stroke-width="3" stroke-linecap="round"/></g>
<ellipse cx="54" cy="56" rx="4.2" ry="2.6" fill="#ff8fa3" opacity=".55"/>
</g>
</g>
</svg>
